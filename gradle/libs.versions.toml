[versions]
jdk = "17"
sdk-compile = "36"
sdk-min = "23"
sdk-target = "36"

agp = "9.1.0"
androidx-test-ext-junit = "1.3.0"
app-compat = "1.7.1"
app-update = "2.1.0"
blur-image-view = "1.0.1"
constraint-layout = "2.2.1"
core-ktx = "1.17.0"
crashlytics = "3.0.6"
espresso-core = "3.7.0"
firebase-bom = "34.10.0"
fragment-ktx = "1.8.9"
google-services = "4.4.4"
hilt = "2.59.2"
junit = "4.13.2"
kotlin = "2.2.0"
kotlinx-coroutines-android="1.10.2"
kotlinx-serialization="1.10.0"
ksp = "2.3.6"
ktlint = "1.5.0"
legacy-support-v4 = "1.0.0"
lifecycle = "2.10.0"
material = "1.13.0"
materialratingbar = "1.4.0"
multidex = "2.0.1"
navigation = "2.9.7"
okhttp3 = "5.3.2"
play-services-location = "21.3.0"
play-services-maps = "20.0.0"
picasso = "2.8"
retrofit = "3.0.0"
retrofit-kotlinx-converter = "1.0.0"
room = "2.8.4"
security = "1.1.0"
spotless-version = "8.3.0"

[libraries]

#Android
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "app-compat" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraint-layout" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment-ktx" }
legacy-support-v4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "legacy-support-v4" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
multidex = { group = "androidx.multidex", name = "multidex", version.ref = "multidex" }

#App update
app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "app-update" }

#Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-config = { group = "com.google.firebase", name = "firebase-config" }

#Blur image view
blurImageView = { group = "com.github.jgabrielfreitas", name = "BlurImageView", version.ref = "blur-image-view" }

#Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

#Kotlin
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines-android" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

#LiveData
lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

#Material rating bar
materialratingbar = { group = "me.zhanghai.android.materialratingbar", name = "library", version.ref = "materialratingbar" }

#Navigation
navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

#Play services
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "play-services-location" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "play-services-maps" }

#Picasso
picasso = { group = "com.squareup.picasso", name = "picasso", version.ref = "picasso" }

#Retrofit
okhttp3-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp3" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofit-kotlinx-converter" }

#Room
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }

#Security
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security" }

#Tests
junit = { group = "junit", name = "junit", version.ref = "junit" }

#Android tests
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kapt = { id = "com.android.legacy-kapt", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-version" }

[bundles]
firebase = [
    "firebase-analytics",
    "firebase-config",
    "firebase-crashlytics",
]
retrofit = [
    "okhttp3-logging-interceptor",
    "retrofit",
    "retrofit-kotlinx-serialization-converter",
]